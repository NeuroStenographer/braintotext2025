# Example Conda environment specification for b2txt25 (base environment)
# This file is provided as reference. The Docker setup handles this automatically.
# 
# To create this environment manually:
# conda env create -f environment-base.yml

name: b2txt25
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23.0
  
  # Scientific computing
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  
  # Machine learning
  - scikit-learn=1.5.1
  
  # PySpark and Java
  - openjdk=11
  - pyspark>=3.4.0
  
  # Data processing
  - h5py>=3.8.0
  - tables>=3.8.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn=0.12.1
  - plotly>=5.14.0
  
  # Jupyter
  - jupyter>=1.0.0
  - jupyterlab>=3.6.0
  - ipython>=8.10
  - notebook
  
  # Development tools
  - pytest>=7.2.0
  - pytest-cov>=3.0.0
  - pytest-mock>=1.7.1
  - ruff=0.12.0
  
  # Pip packages
  - pip:
    - kedro[jupyter]==1.0.0
    - kedro-datasets>=3.0
    - kedro-viz>=6.7.0
