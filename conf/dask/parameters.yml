dask_client:
  # Turn Dask-on-Ray on/off
  use_ray: true

  # Passed to ray.init(**ray_init)
  ray_init:
    # For local Ray:
    num_cpus: 8
    # For remote cluster:
    # address: "ray://your-ray-head-node:10001"

  # Normal Dask Client kwargs (still used)
  processes: false
  threads_per_worker: 1
  n_workers: 4
  # timeout: 60
  # memory_limit: "4GB"
